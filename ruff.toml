line-length = 100
target-version = "py311"

# Исключаем черновики из проверки
extend-exclude = ["scripts", ".venv", "notebooks"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",   # line too long (обрабатывается format-ом)
    "N803",   # argument name should be lowercase (X, X_train — стандарт ML)
    "N806",   # variable in function should be lowercase (X, X_train)
]

[format]
quote-style = "double"
indent-style = "space"
