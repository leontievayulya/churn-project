[project]
name = "churn-project"
version = "0.1.0"
description = "Telco Customer Churn prediction"
authors = [
    {name = "YulyaIvanova", email = "leontievayulya@mail.ru"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.4.6,<2.5.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<1.0.0)",
]

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.4,<5.0.0)",
    "ruff (>=0.16.9,<1.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Настройки mypy ---
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
exclude = [
    '^scripts/',
    '^notebooks/',
]
